<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080c" />
    <title>行业案例库 · Cloudscape 3D</title>
    <meta name="description" content="Cloudscape 3D 行业案例库，覆盖家电、文博、医疗、航天、自然生态等垂直领域。" />
    <style>
      :root {
        --bg: #06080c;
        --panel: rgba(16, 19, 26, 0.72);
        --line: rgba(255, 255, 255, 0.08);
        --line-gold: rgba(201, 164, 92, 0.42);
        --text: #eef1f5;
        --muted: #8d96a3;
        --gold: #c9a45c;
        --gold-light: #e3c98f;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      html, body { min-height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        padding-bottom: 86px;
      }

      /* ---------------- 滚动进度 ---------------- */
      .progress {
        position: fixed; top: 0; left: 0; height: 2px; width: 0; z-index: 90;
        background: linear-gradient(90deg, #8a7340, var(--gold-light));
        box-shadow: 0 0 14px rgba(201, 164, 92, 0.55);
        transition: width 0.1s linear;
      }

      /* ---------------- 背景氛围 ---------------- */
      .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .bg-glow {
        position: absolute; inset: -20% -10% auto -10%; height: 72%;
        background:
          radial-gradient(46% 58% at 16% 0%, rgba(201, 164, 92, 0.17), transparent 70%),
          radial-gradient(40% 54% at 86% -4%, rgba(95, 211, 208, 0.13), transparent 72%);
        filter: blur(8px);
        animation: breathe 9s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.86; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .bg-grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(120, 160, 210, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 160, 210, 0.055) 1px, transparent 1px);
        background-size: 58px 58px;
        mask-image: radial-gradient(125% 82% at 50% 0%, #000 0%, transparent 70%);
      }
      .shell { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; }

      /* ---------------- 返回与 Hero ---------------- */
      .back {
        display: inline-flex; align-items: center; gap: 7px; color: var(--muted);
        text-decoration: none; font-size: 12px; border: 1px solid var(--line);
        border-radius: 999px; padding: 8px 16px; background: rgba(12, 15, 20, 0.6);
        white-space: nowrap;
        transition: color 0.2s, border-color 0.2s, transform 0.2s;
      }
      .back svg { width: 13px; height: 13px; }
      .back:hover { color: var(--gold); border-color: var(--line-gold); transform: translateX(-3px); }
      /* ---------------- Hero ---------------- */
      .hero { padding: 44px 40px 0; display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
      .hero-main { flex: 1 1 auto; min-width: 0; }
      .hero .back { flex: 0 0 auto; }
      .hero h1 {
        font-size: clamp(38px, 5.4vw, 68px); font-weight: 700; line-height: 1; letter-spacing: 0.04em;
        background: linear-gradient(112deg, #f6f3ec 0%, #e3c98f 30%, #c9a45c 55%, #7d6633 80%, #e3c98f 100%);
        background-size: 220% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: sheen 9s ease-in-out infinite;
      }
      @keyframes sheen {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      .hero-sub { margin-top: 14px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.4em; color: var(--muted); }
      .hero-note { margin-top: 18px; font-size: 13px; line-height: 2; color: #9aa3ae; }
      .hero-note strong { color: var(--gold-light); font-weight: 500; }

      /* ---------------- AI 场景顾问 ---------------- */
      .advisor {
        position: relative; margin: 36px 40px 0; padding: 26px 28px;
        border-radius: 20px; border: 1px solid var(--line); overflow: hidden;
        background: linear-gradient(160deg, rgba(30, 34, 44, 0.92), rgba(13, 16, 22, 0.94));
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      .advisor::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(620px circle at 10% -10%, rgba(201, 164, 92, 0.13), transparent 62%);
      }
      .advisor.is-active {
        border-color: var(--line-gold);
        box-shadow: 0 0 0 1px rgba(201, 164, 92, 0.14), 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .advisor-head { position: relative; display: flex; align-items: center; gap: 14px; }
      .advisor-mark {
        width: 46px; height: 46px; flex: 0 0 auto; border-radius: 13px;
        display: grid; place-items: center; border: 1px solid var(--line-gold);
        background: rgba(201, 164, 92, 0.07);
        box-shadow: inset 0 0 24px rgba(201, 164, 92, 0.12);
      }
      .advisor-mark svg { width: 34px; height: 34px; display: block; }
      .advisor-heading h2 { font-size: 16.5px; font-weight: 600; letter-spacing: 0.06em; }
      .advisor-heading p { margin-top: 5px; font-size: 12px; color: var(--muted); line-height: 1.7; }
      .advisor-toggle {
        margin-left: auto; width: 34px; height: 34px; flex: 0 0 auto;
        display: grid; place-items: center; cursor: pointer;
        border: 1px solid var(--line); border-radius: 10px;
        background: rgba(9, 11, 16, 0.6); color: #a9b2bd;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }
      .advisor-toggle:hover { color: var(--gold-light); border-color: var(--line-gold); background: rgba(201, 164, 92, 0.1); }
      .advisor-toggle svg { width: 17px; height: 17px; transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
      .advisor.is-collapsed .advisor-toggle svg { transform: rotate(180deg); }
      .advisor.is-collapsed .advisor-form,
      .advisor.is-collapsed .advisor-examples,
      .advisor.is-collapsed .advisor-result { display: none; }

      .advisor-form { position: relative; display: flex; gap: 10px; margin-top: 22px; }
      .advisor-form input {
        flex: 1; background: rgba(9, 11, 16, 0.82); border: 1px solid var(--line);
        border-radius: 12px; padding: 13px 16px; color: var(--text);
        font-size: 13.5px; font-family: inherit; outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .advisor-form input::placeholder { color: #5f6773; }
      .advisor-form input:focus { border-color: var(--line-gold); box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.12); }
      .advisor-form button {
        border: 0; border-radius: 12px; padding: 0 28px; font-family: inherit;
        font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #1a1408;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        cursor: pointer; transition: filter 0.2s, transform 0.12s;
      }
      .advisor-form button:hover { filter: brightness(1.07); }
      .advisor-form button:active { transform: scale(0.98); }
      .advisor-form button:disabled { filter: grayscale(0.65) brightness(0.75); cursor: not-allowed; }

      .advisor-examples { position: relative; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
      .advisor-examples button {
        font-family: inherit; font-size: 11.5px; color: #a9b2bd; cursor: pointer;
        border: 1px dashed var(--line); background: transparent; border-radius: 999px;
        padding: 7px 14px; transition: color 0.2s, border-color 0.2s;
      }
      .advisor-examples button:hover { color: var(--gold-light); border-color: var(--line-gold); }

      .advisor-result { position: relative; margin-top: 24px; animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

      .steps { display: grid; gap: 12px; }
      .step {
        display: grid; grid-template-columns: auto 1fr; gap: 15px;
        padding: 15px 17px; border-radius: 13px;
        border: 1px solid var(--line); background: rgba(10, 13, 18, 0.62);
      }
      .step-idx {
        align-self: start; font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
        color: var(--gold); border: 1px solid var(--line-gold); border-radius: 6px; padding: 4px 8px;
      }
      .step-label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--gold-light); margin-bottom: 7px; }
      .step-text { font-size: 12.5px; line-height: 1.95; color: #b7bfc9; }
      .step.is-loading .step-text { color: var(--muted); }
      .step.is-loading .step-text::after {
        content: ''; display: inline-block; width: 6px; height: 12px; margin-left: 6px;
        vertical-align: -2px; background: var(--gold);
        animation: blink 0.9s step-end infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      .step-list { margin: 4px 0 0; padding: 0; list-style: none; counter-reset: step; }
      .step-list li {
        position: relative; padding-left: 28px; margin-top: 9px;
        font-size: 12.5px; line-height: 1.9; color: #b7bfc9;
      }
      .step-list li::before {
        counter-increment: step; content: counter(step);
        position: absolute; left: 0; top: 4px;
        width: 17px; height: 17px; display: grid; place-items: center;
        border-radius: 50%; border: 1px solid var(--line-gold);
        color: var(--gold); font-family: var(--mono); font-size: 9.5px;
      }

      .cost-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 4px; }
      .cost-cell {
        padding: 11px 13px; border-radius: 12px;
        border: 1px solid var(--line); background: rgba(10, 13, 18, 0.62);
      }
      .cost-k { display: block; font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); }
      .cost-v { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--gold-light); }
      .cost-total {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
        padding: 8px 15px; border-radius: 999px;
        font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
        color: #1a1408; background: linear-gradient(135deg, var(--gold-light), var(--gold));
      }

      .advisor-models { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; margin-top: 18px; }
      .rec-card {
        display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer;
        border-radius: 12px; border: 1px solid var(--line); background: rgba(12, 15, 21, 0.72);
        transition: border-color 0.2s, transform 0.2s, background 0.2s;
      }
      .rec-card:hover { border-color: var(--line-gold); transform: translateY(-2px); background: rgba(201, 164, 92, 0.07); }
      .rec-thumb {
        width: 52px; height: 52px; flex: 0 0 auto; border-radius: 9px; overflow: hidden;
        display: grid; place-items: center; background: #0a0c11;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .rec-thumb img { width: 100%; height: 100%; object-fit: contain; }
      .rec-name { font-size: 12px; font-weight: 500; line-height: 1.45; }
      .rec-cat { font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; }

      .advisor-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
      .advisor-actions .act {
        font-size: 11.5px; color: #a9b2bd; padding: 7px 14px; border-radius: 999px;
        border: 1px dashed var(--line);
      }
      .advisor-actions .act-btn {
        font-family: inherit; font-size: 12px; cursor: pointer;
        color: var(--gold-light); border: 1px solid var(--line-gold);
        background: rgba(201, 164, 92, 0.1); border-radius: 999px; padding: 8px 16px;
        transition: background 0.2s, color 0.2s;
      }
      .advisor-actions .act-btn:hover { background: rgba(201, 164, 92, 0.2); }
      .advisor-actions .act-btn.is-on { color: #1a1408; background: linear-gradient(135deg, var(--gold-light), var(--gold)); border-color: transparent; }
      .stats { display: none; }
      .stat {
        border: 1px solid var(--line); border-radius: 14px; padding: 15px 19px;
        background: var(--panel); backdrop-filter: blur(14px);
      }
      .stat b { display: block; font-size: 25px; font-weight: 600; color: var(--gold-light); font-variant-numeric: tabular-nums; line-height: 1.1; }
      .stat span { display: block; margin-top: 6px; font-size: 10px; letter-spacing: 0.18em; color: var(--muted); }

      /* ---------------- 分类 ---------------- */
      .filters { display: flex; flex-wrap: wrap; gap: 9px; padding: 36px 40px 0; }
      .filter {
        display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--line);
        background: rgba(12, 15, 20, 0.55); color: #b6bec9; font-family: inherit; font-size: 12.5px;
        padding: 9px 16px; border-radius: 999px; cursor: pointer;
        transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s;
      }
      .filter:hover { color: var(--gold-light); border-color: var(--line-gold); }
      .filter:active { transform: scale(0.97); }
      .filter em { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--muted); }
      .filter.is-active {
        color: #1a1408; border-color: transparent; font-weight: 600;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
      }
      .filter.is-active em { color: rgba(26, 20, 8, 0.6); }
      .filter .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--muted)); }

      .toolbar { display: flex; align-items: center; gap: 16px; padding: 20px 40px 24px; }
      .search {
        flex: 0 1 330px; background: rgba(12, 15, 20, 0.75); border: 1px solid var(--line);
        border-radius: 11px; padding: 11px 15px; color: var(--text); font-size: 13px;
        font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search::placeholder { color: #5f6773; }
      .search:focus { border-color: var(--line-gold); box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.1); }
      .toolbar .hint { font-size: 11.5px; color: var(--muted); letter-spacing: 0.05em; }
      .toolbar .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.16em; }

      /* ---------------- 卡片 ---------------- */
      .grid { padding: 0 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 22px; }
      .card {
        position: relative; border: 1px solid var(--line); border-radius: 18px;
        background: linear-gradient(168deg, rgba(26, 30, 39, 0.94), rgba(14, 17, 23, 0.94));
        overflow: hidden; cursor: pointer;
        transform-style: preserve-3d;
        transition: border-color 0.26s, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.26s;
        animation: card-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes card-in {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .card::after {
        content: ''; position: absolute; inset: 0; border-radius: 18px; opacity: 0;
        transition: opacity 0.3s; pointer-events: none;
        background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(201, 164, 92, 0.15), transparent 62%);
      }
      .card:hover {
        border-color: var(--line-gold);
        transform: translateY(-6px) perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.62), 0 0 0 1px rgba(201, 164, 92, 0.15);
      }
      .card:hover::after { opacity: 1; }
      .card-accent {
        position: absolute; top: 0; left: 0; right: 0; height: 2px; z-index: 2;
        background: linear-gradient(90deg, var(--cat, var(--gold)), transparent 88%);
        opacity: 0.9;
      }
      .card-media {
        position: relative; aspect-ratio: 4 / 3; overflow: hidden; display: grid; place-items: center;
        background:
          radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--cat, #c9a45c) 15%, transparent), transparent 66%),
          linear-gradient(180deg, #0c0f15, #090b0f);
      }
      .card-media img {
        width: 100%; height: 100%; object-fit: contain; display: block;
        opacity: 0; transform: scale(0.96);
        transition: opacity 0.6s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card-media img.is-ready { opacity: 1; transform: scale(1); }
      .card:hover .card-media img.is-ready { transform: scale(1.08); }
      .thumb-loading { font-family: var(--mono); font-size: 10px; letter-spacing: 0.26em; color: #4d5561; }

      .card-slot {
        position: absolute; top: 12px; left: 14px; z-index: 2;
        font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.5); padding: 3px 8px; border-radius: 6px;
        background: rgba(6, 8, 12, 0.5); border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .card-cat {
        position: absolute; top: 12px; right: 12px; z-index: 2;
        font-size: 10.5px; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 999px;
        color: color-mix(in srgb, var(--cat, #c9a45c) 88%, #ffffff);
        border: 1px solid color-mix(in srgb, var(--cat, #c9a45c) 46%, transparent);
        background: color-mix(in srgb, var(--cat, #c9a45c) 18%, rgba(6, 8, 12, 0.6));
      }
      .card-cta {
        position: absolute; left: 50%; bottom: 16px; z-index: 2;
        transform: translate(-50%, 10px); opacity: 0; white-space: nowrap;
        font-size: 11.5px; letter-spacing: 0.12em; padding: 8px 18px; border-radius: 999px;
        color: #1a1408; font-weight: 600;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        transition: opacity 0.26s, transform 0.26s;
      }
      .card:hover .card-cta { opacity: 1; transform: translate(-50%, 0); }

      .card-info { padding: 17px 18px 18px; }
      .card-title {
        font-size: 14.5px; font-weight: 600; line-height: 1.45; letter-spacing: 0.01em;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .card-desc {
        margin-top: 9px; font-size: 11.5px; line-height: 1.8; color: #8d96a3;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        min-height: 5.4em;
      }
      .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
      .card-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 15px; }
      .card-same {
        position: relative; z-index: 2;
        display: flex; align-items: center; gap: 7px;
        padding: 7px 14px; border-radius: 999px;
        font-size: 11.5px; letter-spacing: 0.08em; text-decoration: none;
        color: var(--gold-light); border: 1px solid var(--line-gold);
        background: rgba(201, 164, 92, 0.08);
        transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      }
      .card-same svg { width: 12px; height: 12px; transition: transform 0.2s; }
      .card-same:hover { background: rgba(201, 164, 92, 0.22); box-shadow: 0 6px 18px rgba(201, 164, 92, 0.16); }
      .card-same:hover svg { transform: translateX(2px); }
      .card-apply {
        position: relative; z-index: 2;
        display: inline-flex; align-items: center; gap: 5px;
        padding: 6px 12px; border-radius: 999px;
        font-family: inherit; font-size: 11px; font-weight: 500;
        letter-spacing: 0.06em; cursor: pointer;
        color: #7f8792; border: 1px solid var(--line);
        background: transparent; text-decoration: none;
        transition: color 0.2s, border-color 0.2s;
      }
      .card-apply svg { width: 11px; height: 11px; }
      .card-apply:hover { color: var(--gold-light); border-color: var(--line-gold); }
      .tag {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em;
        color: #98a1ad; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
      }
      .tag.is-accent {
        color: color-mix(in srgb, var(--cat, #c9a45c) 86%, #ffffff);
        border-color: color-mix(in srgb, var(--cat, #c9a45c) 40%, transparent);
        background: color-mix(in srgb, var(--cat, #c9a45c) 12%, transparent);
      }

      .card.is-empty { cursor: default; border-style: dashed; background: rgba(14, 17, 23, 0.5); }
      .card.is-empty:hover { transform: none; border-color: var(--line); box-shadow: none; }
      .card.is-empty:hover::after { opacity: 0; }
      .card.is-empty .card-media { background: none; }
      .empty-mark {
        width: 46px; height: 46px; border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.14);
        display: grid; place-items: center; color: #454d58; font-size: 20px; font-weight: 300;
      }
      .card.is-empty .card-title, .card.is-empty .card-desc { color: #5c646f; }

      .empty {
        grid-column: 1 / -1; padding: 80px 0; text-align: center;
        color: var(--muted); font-size: 13px; letter-spacing: 0.08em;
      }

      /* ---------------- 全屏查看器 ---------------- */
      .viewer {
        position: fixed; inset: 0; z-index: 60; display: none;
        background:
          radial-gradient(ellipse 56% 44% at 50% 42%, rgba(201, 164, 92, 0.17), transparent 64%),
          radial-gradient(ellipse 92% 72% at 50% 40%, rgba(120, 160, 210, 0.08), transparent 72%),
          linear-gradient(168deg, #21262f 0%, #141821 44%, #090b10 100%);
      }
      .viewer::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(120, 160, 210, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 160, 210, 0.05) 1px, transparent 1px);
        background-size: 58px 58px;
        mask-image: radial-gradient(72% 62% at 50% 42%, #000 0%, transparent 78%);
      }
      .viewer::after {
        content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background: radial-gradient(ellipse 78% 70% at 50% 46%, transparent 46%, rgba(4, 6, 10, 0.72) 100%);
      }
      .viewer.is-open { display: block; animation: viewer-in 0.3s ease; }
      @keyframes viewer-in { from { opacity: 0; } to { opacity: 1; } }
      .viewer canvas { position: relative; z-index: 1; display: block; width: 100%; height: 100%; touch-action: none; }

      .viewer-top {
        position: absolute; top: 0; left: 0; right: 0; z-index: 3;
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 16px; padding: 26px 32px; pointer-events: none;
      }
      .viewer-heading { display: flex; flex-direction: column; gap: 10px; max-width: min(620px, 62vw); }
      .viewer-heading b {
        position: relative; padding-left: 16px;
        font-size: 21px; font-weight: 600; letter-spacing: 0.06em; line-height: 1.3;
        background: linear-gradient(100deg, #f6f3ec 0%, #e3c98f 34%, #c9a45c 62%, #9c7a38 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 18px rgba(201, 164, 92, 0.22));
      }
      .viewer-heading b::before {
        content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 3px;
        background: linear-gradient(180deg, var(--gold-light), var(--gold));
        box-shadow: 0 0 14px rgba(201, 164, 92, 0.55);
      }
      .viewer-sub {
        padding-left: 16px; font-family: var(--mono); font-size: 10.5px;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
      }
      .viewer-top-actions { display: flex; align-items: center; gap: 9px; pointer-events: auto; }
      .vnav {
        width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%;
        border: 1px solid var(--line); background: rgba(12, 15, 20, 0.66); color: var(--gold-light);
        cursor: pointer; backdrop-filter: blur(10px);
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
      }
      .vnav svg { width: 17px; height: 17px; }
      .vnav:hover { border-color: var(--line-gold); background: rgba(201, 164, 92, 0.14); }
      .vnav:active { transform: scale(0.93); }
      .viewer-close {
        pointer-events: auto; border: 1px solid var(--line); background: rgba(12, 15, 20, 0.66);
        color: var(--text); padding: 10px 20px; border-radius: 999px; font-size: 12.5px;
        font-family: inherit; letter-spacing: 0.08em; cursor: pointer; backdrop-filter: blur(10px);
        transition: color 0.2s, border-color 0.2s;
      }
      .viewer-close:hover { color: var(--gold); border-color: var(--line-gold); }

      .viewer-tags { display: flex; flex-wrap: wrap; gap: 7px; }
      .viewer-tags:empty { display: none; }
      .viewer-tags span {
        padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line);
        background: rgba(201, 164, 92, 0.09); color: var(--gold-light);
        font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em;
      }
      .viewer-tags span b { color: var(--text); font-weight: 600; }

      .viewer-info {
        position: absolute; left: 32px; bottom: 32px; z-index: 3;
        max-width: min(460px, 58vw); padding: 18px 20px; border-radius: 15px;
        border: 1px solid var(--line); background: rgba(10, 13, 18, 0.76);
        backdrop-filter: blur(18px); display: grid; gap: 10px;
      }
      .viewer-desc { font-size: 12px; line-height: 1.9; color: #a49c8e; }

      .viewer-tools { position: absolute; right: 32px; bottom: 32px; z-index: 3; display: flex; gap: 9px; }
      .viewer-tools button {
        border: 1px solid var(--line); background: rgba(10, 13, 18, 0.74); color: #b8c0cb;
        font-family: inherit; font-size: 12px; padding: 10px 16px; border-radius: 11px;
        cursor: pointer; backdrop-filter: blur(12px);
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }
      .viewer-tools button:hover { color: var(--gold-light); border-color: var(--line-gold); }
      .viewer-tools button.is-on { color: var(--gold-light); border-color: var(--line-gold); background: rgba(201, 164, 92, 0.15); }

      /* 查看器侧边：手机扫码引导卡片 */
      .viewer-qr {
        position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
        z-index: 3; width: 180px; padding: 14px;
        border-radius: 16px; border: 1px solid var(--line-gold);
        background: rgba(10, 13, 18, 0.78); backdrop-filter: blur(18px);
        text-align: center; cursor: pointer;
        box-shadow: 0 0 26px rgba(201, 164, 92, 0.22), inset 0 0 22px rgba(201, 164, 92, 0.06);
        transition: box-shadow 0.25s, transform 0.25s;
        animation: vqr-in 0.45s cubic-bezier(0.2, 1.1, 0.4, 1) both;
      }
      @keyframes vqr-in { from { opacity: 0; transform: translateY(-50%) translateX(14px); } to { opacity: 1; transform: translateY(-50%) translateX(0); } }
      .viewer-qr:hover { box-shadow: 0 0 40px rgba(201, 164, 92, 0.36), inset 0 0 26px rgba(201, 164, 92, 0.1); }
      .vqr-icon {
        width: 44px; height: 44px; margin: 0 auto; display: grid; place-items: center;
        border-radius: 50%; border: 1px solid var(--line-gold);
        background: radial-gradient(circle at 50% 40%, rgba(201, 164, 92, 0.22), rgba(10, 10, 12, 0.6));
        color: var(--gold-light);
        box-shadow: 0 0 18px rgba(201, 164, 92, 0.28);
      }
      .vqr-icon svg { width: 21px; height: 21px; }
      .vqr-head { margin-top: 11px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--gold-light); }
      .vqr-tip { margin-top: 7px; font-size: 10.5px; line-height: 1.6; color: var(--muted); }
      .vqr-code {
        width: 128px; margin: 12px auto 0; padding: 7px; border-radius: 11px; background: #f6f0e2;
        box-shadow: inset 0 0 0 1px rgba(125, 102, 51, 0.25);
        animation: vqr-code-in 0.32s ease;
      }
      @keyframes vqr-code-in { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .vqr-code[hidden] { display: none; }
      .vqr-code canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
      .vqr-cta {
        width: 100%; margin-top: 12px; padding: 9px 12px; border: none; border-radius: 999px;
        background: linear-gradient(135deg, #e3c98f, #c9a45c); color: #1a1408;
        font-family: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em;
        cursor: pointer; transition: filter 0.2s;
      }
      .vqr-cta:hover { filter: brightness(1.08); }
      .vqr-cta:active { filter: brightness(0.95); }

      .viewer-loading {
        position: absolute; inset: 0; z-index: 4; display: grid; place-items: center;
        font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.3em; color: var(--muted);
        pointer-events: none; background: rgba(4, 6, 10, 0.55);
      }
      .viewer-loading.is-hidden { display: none; }

      .vqr-url {
        margin-top: 7px; font-family: var(--mono, monospace); font-size: 8.5px;
        line-height: 1.3; letter-spacing: 0.02em; color: #7d6633;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .vqr-url[hidden] { display: none; }

      @media (max-width: 720px) {
        .hero, .filters, .toolbar, .grid { padding-left: 18px; padding-right: 18px; }
        .advisor { margin-left: 18px; margin-right: 18px; padding: 20px 18px; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 13px; }
        .toolbar .hint, .toolbar .count { display: none; }
        .viewer-info { left: 16px; right: 16px; bottom: 80px; max-width: none; }
        .viewer-tools { right: 16px; bottom: 18px; }
        .viewer-qr { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="progress" id="progress"></div>
    <div class="bg">
      <div class="bg-glow"></div>
      <div class="bg-grid"></div>
    </div>

    <div class="shell">
      <section class="hero">
        <div class="hero-main">
          <h1>行业案例库</h1>
          <div class="hero-sub">Vertical Solutions · Model Showcase</div>
          <p class="hero-note">
            Cloudscape 3D 可为<strong>不同垂直领域</strong>生成 3D 模型与数字展陈方案，
            覆盖家电电子、文博艺术、医疗健康、天文航天、自然生态、工业装备等场景。
          </p>
        </div>
        <a class="back" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          返回工作台
        </a>
        <div class="stats">
          <div class="stat"><b id="stat-total">—</b><span>案例模型</span></div>
          <div class="stat"><b id="stat-cat">—</b><span>垂直领域</span></div>
          <div class="stat"><b id="stat-size">—</b><span>资源体积</span></div>
          <div class="stat"><b id="stat-slot">—</b><span>展示位</span></div>
        </div>
      </section>

      <section class="advisor" id="advisor">
        <div class="advisor-head">
          <span class="advisor-mark">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <ellipse cx="60" cy="104" rx="40" ry="10" fill="#9c7a38" />
              <ellipse cx="60" cy="98" rx="40" ry="10" fill="#c9a45c" />
              <polygon points="60,18 84,32 60,46 36,32" fill="#e3c98f" />
              <polygon points="36,32 60,46 60,74 36,60" fill="#c9a45c" />
              <polygon points="84,32 84,60 60,74 60,46" fill="#9c7a38" />
              <line x1="60" y1="78" x2="60" y2="88" stroke="#e3c98f" stroke-width="2.4" stroke-dasharray="3 4" opacity="0.85" />
            </svg>
          </span>
          <div class="advisor-heading">
            <h2>场景顾问</h2>
            <p id="advisor-subtitle">描述你的行业与目标，AI 会感知意图、推理匹配、给出可落地的 3D 方案</p>
          </div>
          <button class="advisor-toggle" id="advisor-toggle" type="button" aria-expanded="true" aria-label="折叠或展开场景顾问">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 15l6-6 6 6" />
            </svg>
          </button>
        </div>

        <form class="advisor-form" id="advisor-form">
          <input
            id="advisor-input"
            type="text"
            placeholder="例如：我要为医疗器械企业做一个线上 3D 展厅"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" id="advisor-submit">分析</button>
        </form>

        <div class="advisor-examples" id="advisor-examples"></div>

        <div class="advisor-result" id="advisor-result" hidden>
          <div class="steps" id="advisor-steps"></div>
          <div class="advisor-models" id="advisor-models"></div>
          <div class="advisor-actions" id="advisor-actions"></div>
        </div>
      </section>

      <nav class="filters" id="filters"></nav>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="搜索模型 / 领域 / 描述…" autocomplete="off" />
        <span class="hint">点击卡片全屏查看 · 支持旋转 · 缩放 · 平移</span>
        <span class="count" id="count"></span>
      </div>

      <main class="grid" id="grid"></main>
    </div>



    <div class="viewer" id="viewer">
      <canvas id="viewer-canvas"></canvas>
      <div class="viewer-top">
        <div class="viewer-heading">
          <b id="viewer-name">—</b>
          <span class="viewer-sub" id="viewer-sub">—</span>
        </div>
        <div class="viewer-top-actions">
          <button class="viewer-close" id="viewer-close" type="button">关闭 (Esc)</button>
        </div>
      </div>
      <div class="viewer-info">
        <div class="viewer-tags" id="viewer-tags"></div>
        <div class="viewer-desc" id="viewer-desc"></div>
      </div>
      <div class="viewer-tools">
        <button type="button" data-act="reset">重置视角</button>
        <button type="button" data-act="rotate" class="is-on">自动旋转</button>
        <button type="button" data-act="fullscreen">全屏</button>
      </div>

      <aside class="viewer-qr" id="viewer-qr" aria-label="扫码在手机上查看该模型">
        <div class="vqr-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="6" y="2.5" width="12" height="19" rx="2.6" />
            <path d="M10.5 18.6h3" />
          </svg>
        </div>
        <div class="vqr-head">手机或微信扫码</div>
        <div class="vqr-tip">在手机上旋转 · 缩放 · 沉浸浏览</div>
        <div class="vqr-code" id="vqr-code" hidden>
          <canvas id="qr-canvas-sm" width="320" height="320"></canvas>
          <div class="vqr-url" id="vqr-url">—</div>
        </div>
        <button type="button" class="vqr-cta" id="vqr-cta">显示二维码</button>
      </aside>

      <div class="viewer-loading" id="viewer-loading">载入模型…</div>
    </div>



    <script type="module" src="/src/gallery.js"></script>
  </body>
</html>
